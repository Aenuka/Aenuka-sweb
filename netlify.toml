[build]
  publish = "dist"
  functions = "src/functions"
  command = "npm run build"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  functions = "src/functions"

[[redirects]]
  from = "/about"
  to = "/about/index.html"
  status = 200

[[redirects]]
  from = "/skills"
  to = "/skills/index.html"
  status = 200

[[redirects]]
  from = "/projects"
  to = "/projects/index.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
